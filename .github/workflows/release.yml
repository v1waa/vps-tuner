name: Build and publish release
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['release-request.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server-validation:
    uses: ./.github/workflows/ci.yml
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: xvfb-run -a node scripts/smoke-ui.mjs
      - name: Check version against tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "if ('v'+require('./package.json').version!==process.env.GITHUB_REF_NAME) process.exit(1)"
  package:
    needs: [check, server-validation]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Windows desktop smoke test
        if: runner.os == 'Windows'
        run: node scripts/smoke-ui.mjs
      - name: Build installers
        run: npx electron-builder --${{ matrix.platform }} --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    needs: [check, server-validation, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum *.exe *.AppImage *.deb *.tar.gz > SHA256SUMS.txt
      - name: Publish binaries and release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          gh release create "$tag" release/* --title "VPS Tuner $tag" --notes-file docs/RELEASE-v0.1.0.md --target "$GITHUB_SHA"
